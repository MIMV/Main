<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIMV — 50+ apps, millions of downloads, since 2007</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles/main.css?v=11">
<link rel="stylesheet" href="styles/wow.css?v=11">
<link rel="stylesheet" href="styles/founder.css?v=13">
<link rel="icon" type="image/png" href="assets/mimv-logo.png">
</head>
<body>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data/apps.js?v=7"></script>

<div id="root"></div>

<script type="text/babel" src="components/Intro.jsx"></script>
<script type="text/babel" src="components/Hero.jsx"></script>
<script type="text/babel" src="components/Apps.jsx"></script>
<script type="text/babel" src="components/Founder.jsx"></script>
<script type="text/babel" src="components/Sections.jsx"></script>
<script type="text/babel" src="components/Chrome.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

// Tweakable defaults (user-editable via Tweaks toggle)
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#B45309",
  "accent2": "#F59E0B"
}/*EDITMODE-END*/;

function App() {
  const [accent, setAccentState] = useState(TWEAK_DEFAULTS.accent);
  const [accent2, setAccent2] = useState(TWEAK_DEFAULTS.accent2);
  const [openApp, setOpenApp] = useState(null);
  const [tweaksVisible, setTweaksVisible] = useState(false);
  const [introDone, setIntroDone] = useState(false);

  // Apply accent to <html>
  useEffect(() => {
    document.documentElement.style.setProperty('--accent', accent);
    document.documentElement.style.setProperty('--accent-2', accent2);
  }, [accent, accent2]);

  // Reveal-on-scroll observer
  useEffect(() => {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) e.target.classList.add('in');
      });
    }, { threshold: 0.12 });
    const els = document.querySelectorAll('.reveal');
    els.forEach(el => io.observe(el));
    return () => io.disconnect();
  });

  // Tweaks bridge
  useEffect(() => {
    const onMsg = (e) => {
      if (!e.data || typeof e.data !== 'object') return;
      if (e.data.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', onMsg);
    // announce after listener is in place
    try { window.parent.postMessage({ type: '__edit_mode_available' }, '*'); } catch {}
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const persist = (edits) => {
    try {
      window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    } catch {}
  };

  const setAccent = (v, v2) => {
    setAccentState(v); setAccent2(v2);
    persist({ accent: v, accent2: v2 });
  };

  // Modal close on Esc
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') setOpenApp(null); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  return (
    <>
      {!introDone && <IntroCurtain onDone={() => setIntroDone(true)} />}
      <Nav />
      <Hero />
      <Marquee />
      <LatestApps onOpen={setOpenApp} />
      <Story />
      <Founder />
      <Catalog onOpen={setOpenApp} />
      <Services />
      <Contact />
      <Footer />
      <AppModal app={openApp} onClose={() => setOpenApp(null)} />
      <TweaksPanel
        visible={tweaksVisible}
        accent={accent}
        setAccent={setAccent}
      />
    </>
  );
}

// Wait for all Babel scripts to load before mounting
const tryMount = () => {
  if (window.Hero && window.LatestApps && window.Story && window.Nav && window.IntroCurtain && window.Founder) {
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  } else {
    setTimeout(tryMount, 50);
  }
};
tryMount();
</script>

</body>
</html>
