<script type="text/babel">
const { useState, useEffect } = React;

// Tweakable defaults (user-editable via Tweaks toggle)
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#B45309",
  "accent2": "#F59E0B"
}/*EDITMODE-END*/;

function App() {
  const [accent, setAccentState] = useState(TWEAK_DEFAULTS.accent);
  const [accent2, setAccent2] = useState(TWEAK_DEFAULTS.accent2);
  const [openApp, setOpenApp] = useState(null);
  const [tweaksVisible, setTweaksVisible] = useState(false);
  const [introDone, setIntroDone] = useState(false);

  // Apply accent to <html>
  useEffect(() => {
    document.documentElement.style.setProperty('--accent', accent);
    document.documentElement.style.setProperty('--accent-2', accent2);
  }, [accent, accent2]);

  // Reveal-on-scroll observer
  useEffect(() => {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) e.target.classList.add('in');
      });
    }, { threshold: 0.12 });
    const els = document.querySelectorAll('.reveal');
    els.forEach(el => io.observe(el));
    return () => io.disconnect();
  });

  // Tweaks bridge
  useEffect(() => {
    const onMsg = (e) => {
      if (!e.data || typeof e.data !== 'object') return;
      if (e.data.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', onMsg);
    // announce after listener is in place
    try { window.parent.postMessage({ type: '__edit_mode_available' }, '*'); } catch {}
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const persist = (edits) => {
    try {
      window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    } catch {}
  };

  const setAccent = (v, v2) => {
    setAccentState(v); setAccent2(v2);
    persist({ accent: v, accent2: v2 });
  };

  // Modal close on Esc
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') setOpenApp(null); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  return (
    <>
      {!introDone && <IntroCurtain onDone={() => setIntroDone(true)} />}
      <Nav />
      <Hero />
      <Marquee />
      <LatestApps onOpen={setOpenApp} />
      <Story />
      <Founder />
      <Catalog onOpen={setOpenApp} />
      <Services />
      <Contact />
      <Footer />
      <AppModal app={openApp} onClose={() => setOpenApp(null)} />
      <TweaksPanel
        visible={tweaksVisible}
        accent={accent}
        setAccent={setAccent}
      />
    </>
  );
}

// Wait for all Babel scripts to load before mounting
const tryMount = () => {
  if (window.Hero && window.LatestApps && window.Story && window.Nav && window.IntroCurtain && window.Founder) {
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  } else {
    setTimeout(tryMount, 50);
  }
};
tryMount();
</script>
